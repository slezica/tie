# Tie.app (arm64, .app only, ad-hoc signed by `tie-dev package`). See docs/PACKAGING.md.
appId: com.salezica.tie
productName: Tie
directories:
  output: out/package
  buildResources: build
files:
  - out/**
  - '!out/package/**' # previous packages
  - '!out/log/**' # toolkit traces
  - '!out/.build-stamp'
  - package.json
asarUnpack:
  - node_modules/node-pty/** # native module + spawn-helper must be real files
  - node_modules/tie-peer/** # native module (socket peer identity)
extraResources:
  - from: resources/bin # CLI launcher (shell), put on PATH in Tie terminals
    to: bin
  - from: bin/tie # CLI itself, run by the launcher with Tie's Electron as Node
    to: cli/tie.mjs
  - from: out/package/fingerprint # input hash, lets tie-dev package/install skip when unchanged
    to: fingerprint
mac:
  target:
    - target: dir
      arch: arm64
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: null # signed ad hoc afterwards; no Apple developer identity
# SECURITY: Electron fuses, baked into the binary. Checked after every package (dev/package-check.mjs).
# runAsNode stays on: the CLI launcher runs Tie as Node (resources/bin/tie).
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false # NODE_OPTIONS=--require: code injection
  enableNodeCliInspectArguments: false # --inspect / SIGUSR1: debugger attach = code injection
  enableEmbeddedAsarIntegrityValidation: true # tampered app.asar refuses to load
  onlyLoadAppFromAsar: true # no planted app/ folder
  grantFileProtocolExtraPrivileges: false # file:// pages can't read other files (shell is on tie://)
