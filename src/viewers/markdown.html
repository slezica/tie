<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>markdown</title>
    <!-- Nonce placeholders are replaced per response by main (content.ts): only tagged styles and
         scripts apply. Colors and fonts arrive from the host (theme message) as custom properties. -->
    <style nonce="%NONCE%">
      /* Markdown typography, after Pico CSS v2 (classless): one root font-size knob; type sizes in
         em (follow the text), layout spacing in rem (follows the root), so the knob scales all.
         Shared parts come from the viewer modules (each injects its own nonce'd style): base
         colors, selection, focus (runtime.ts), change marks (marks.ts), code tokens (highlight.ts). */
      :root {
        --scale: 1.15; /* prose over the tile font size (--size, the host's setting) */
        --space: 1rem; /* Pico's --pico-spacing / typography-spacing-vertical: the rhythm unit */
        --rule: color-mix(in srgb, var(--fg) 16%, var(--bg));
        --code-bg: color-mix(in srgb, var(--fg) 7%, var(--bg));
        font-family: var(--font);
        font-size: calc(var(--size) * var(--scale));
        line-height: 1.5;
        font-weight: 400;
      }
      body {
        margin: 0;
        padding: calc(var(--space) * 0.75) calc(var(--space) * 2) calc(var(--space) * 2);
        overflow-wrap: anywhere;
      }
      #doc > :first-child { margin-top: 0 !important; }

      /* Blocks: no top margin, one unit below; a heading after a block gets its own top space. */
      p, ul, ol, dl, blockquote, pre, table, hr, .diagram { margin: 0 0 var(--space); }
      h1, h2, h3, h4, h5, h6 { margin: 0 0 var(--space); font-weight: 700; }
      h1 { font-size: 2em; line-height: 1.125; }
      h2 { font-size: 1.75em; line-height: 1.15; }
      h3 { font-size: 1.5em; line-height: 1.175; }
      h4 { font-size: 1.25em; line-height: 1.2; }
      h5 { font-size: 1.125em; line-height: 1.225; }
      h6 { font-size: 1em; line-height: 1.25; }
      :is(p, ul, ol, dl, blockquote, pre, table, hr, .diagram, figure) ~ h1 { margin-top: calc(var(--space) * 3); }
      :is(p, ul, ol, dl, blockquote, pre, table, hr, .diagram, figure) ~ h2 { margin-top: calc(var(--space) * 2.625); }
      :is(p, ul, ol, dl, blockquote, pre, table, hr, .diagram, figure) ~ h3 { margin-top: calc(var(--space) * 2.25); }
      :is(p, ul, ol, dl, blockquote, pre, table, hr, .diagram, figure) ~ h4 { margin-top: calc(var(--space) * 1.875); }
      :is(p, ul, ol, dl, blockquote, pre, table, hr, .diagram, figure) ~ h5 { margin-top: calc(var(--space) * 1.6875); }
      :is(p, ul, ol, dl, blockquote, pre, table, hr, .diagram, figure) ~ h6 { margin-top: calc(var(--space) * 1.5); }
      h6 { color: var(--muted); }

      /* Lists: markers drawn by us, flush with the text's left edge (numbers left-aligned: "1." and
         "10." start on the same line); item text one fixed indent in (em: follows the text), wrapped
         lines hang under the first. Numbers: the list-item counter (honors start / value, restarts
         per list). Pico's square bullets; a quarter unit between items and before a nested list. */
      :root { --indent: 2em; } /* fits "10." with a gap at the prose font */
      ul, ol { padding-left: 0; list-style: none; }
      :is(ul, ol) > li { position: relative; padding-left: var(--indent); }
      ul > li::before {
        content: '';
        position: absolute;
        left: 0.1em;
        top: calc((1.5em - 0.35em) / 2); /* centered on the first line (line-height 1.5) */
        width: 0.35em;
        height: 0.35em;
        background: currentColor;
      }
      ol > li::before {
        content: counter(list-item) '.';
        position: absolute;
        left: 0;
        font-variant-numeric: tabular-nums;
      }
      li { margin-bottom: calc(var(--space) * 0.25); }
      :is(ul, ol, dl) :is(ul, ol, dl) { margin: calc(var(--space) * 0.25) 0 0; }
      li > p { margin-bottom: calc(var(--space) * 0.5); }
      li > p:last-child { margin-bottom: 0; }

      /* Definition lists (Pico leaves them alone): terms bold, half a unit between terms, a quarter
         between a term's definitions, like list items. */
      dt { font-weight: 600; margin-top: calc(var(--space) * 0.5); }
      dt:first-child { margin-top: 0; }
      dd { margin: calc(var(--space) * 0.25) 0 0 var(--space); }
      dd > p { margin-bottom: calc(var(--space) * 0.25); }
      dd > p:last-child { margin-bottom: 0; }

      a { color: var(--accent); text-decoration: none; cursor: pointer; }
      a:hover { text-decoration: underline; }
      hr { border: 0; border-top: 1px solid var(--rule); height: 0; }
      img { max-width: 100%; height: auto; vertical-align: middle; }
      blockquote {
        margin: var(--space) 0;
        padding: var(--space);
        border-left: 0.25rem solid var(--rule);
        color: var(--muted);
      }
      blockquote > :last-child { margin-bottom: 0; }
      table { width: 100%; border-collapse: collapse; border-spacing: 0; display: block; overflow-x: auto; }
      th, td { padding: calc(var(--space) / 2) var(--space); border-bottom: 1px solid var(--rule); text-align: left; }
      thead th, thead td { font-weight: 600; border-bottom-width: 0.1875rem; }

      /* Code: 0.875em mono; inline as a small pill, blocks padded one unit. */
      code, pre, kbd, samp { font-family: var(--mono); font-size: 0.875em; border-radius: 0.25rem; }
      code { display: inline-block; padding: 0.125em 0.375em; background: var(--code-bg); line-height: 1.4; }
      pre { display: block; background: var(--code-bg); overflow-x: auto; line-height: 1.5; }
      pre > code { display: block; padding: var(--space); background: none; font-size: 1em; line-height: inherit; }

      /* Task lists: the box sits where the bullet was (flush left, centered on the first line).
         Display-only (read-only tiles): drawn as a flat glyph, no hover, no pointer, never focusable
         (disabled). */
      li.task::before { content: none; }
      input.task-box {
        appearance: none;
        display: inline-grid;
        place-content: center;
        box-sizing: border-box;
        width: 0.9em;
        height: 0.9em;
        margin: 0 0.5em 0 0;
        vertical-align: middle; /* same spot checked or not (the ✓ would move the baseline) */
        border: 1px solid var(--muted);
        border-radius: 0.125rem;
        background: none;
        pointer-events: none;
        cursor: default;
      }
      li.task > input.task-box, li.task > p:first-child > input.task-box {
        position: absolute;
        left: 0;
        top: calc((1.5em - 0.9em) / 2);
        margin: 0;
      }
      input.task-box:checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--bg)); }
      input.task-box:checked::before { content: '✓'; color: var(--accent); font: 700 0.75em / 1 var(--font); }

      /* Front matter: shown as-is, never parsed; quieter than code. */
      pre.front-matter { background: none; border: 1px dashed var(--rule); color: var(--muted); }

      /* Footnotes: smaller, after a rule; refs are superscript links. */
      sup.footnote-ref { position: relative; top: -0.5em; font-size: 0.75em; line-height: 0; vertical-align: baseline; }
      hr.footnotes-sep { margin-top: calc(var(--space) * 2); }
      section.footnotes { font-size: 0.875em; color: var(--muted); }
      .footnote-item p { margin-bottom: calc(var(--space) * 0.25); }

      /* Diagrams (```mermaid): source as code until rendered (and on error); the SVG carries its own
         colors (theme passed to Mermaid). */
      .diagram > pre.diagram-src { margin: 0; }
      .diagram.rendered > pre.diagram-src { display: none; }
      .diagram-svg { overflow-x: auto; }
      .diagram-svg > svg { display: block; margin: 0 auto; height: auto; }
      .diagram-error { margin-top: calc(var(--space) * 0.25); color: var(--a1); font-size: 0.875em; }

      /* Remote (or out-of-folder) image: never requested; alt text / URL instead. */
      .img-blocked { display: inline-block; padding: 0 0.4em; border: 1px dashed var(--rule); border-radius: 0.25rem; color: var(--muted); font-size: 0.875em; }
    </style>
  </head>
  <body>
    <main id="doc"></main>
    <script nonce="%NONCE%" src="./markdown.js"></script>
  </body>
</html>
