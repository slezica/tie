<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- SECURITY: UI CSP. Scripts only from the app (never tie-content:); no plugins, workers,
         forms, <base>. Frames: only content tiles (tie-content:), and main's nav lock narrows that
         to each tile's own viewer; frame-src also stops content frames navigating to other origins.
         Inline styles stay: xterm injects <style> elements and style attributes, no nonce support. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-src tie-content:; worker-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Tie</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Title strip: the system's traffic lights only, never Tie UI (absent when borderless). -->
    <div id="titlebar"></div>
    <!-- Bars (renderer/bars.ts): components placed into start / end groups per the `bars` setting;
         a bar with none is hidden. Top / bottom span the width, left / right fit between them. -->
    <div id="bar-top" class="bar h" data-bar="top"><div class="group start"></div><div class="bar-space"></div><div class="group end"></div></div>
    <div id="bar-bottom" class="bar h" data-bar="bottom">
      <div class="group start">
        <span id="brand"></span>
        <div id="tabs"><div id="tab-list"></div><button id="tab-add" title="New tab">+</button></div>
      </div>
      <div class="bar-space"></div>
      <div class="group end">
        <div id="shelf"></div>
        <div id="templates"></div>
      </div>
    </div>
    <div id="bar-left" class="bar v" data-bar="left"><div class="group start"></div><div class="bar-space"></div><div class="group end"></div></div>
    <div id="bar-right" class="bar v" data-bar="right"><div class="group start"></div><div class="bar-space"></div><div class="group end"></div></div>
    <!-- Bar edges (renderer/barsize.ts): drag resizes a bar, double-click: its default size. After the
         bars: no-drag strips carved out of the bars' window drag regions. -->
    <div class="bar-edge v" data-bar="left"></div>
    <div class="bar-edge v" data-bar="right"></div>
    <div class="bar-edge h" data-bar="top"></div>
    <div class="bar-edge h" data-bar="bottom"></div>
    <div id="board-edge"></div>
    <div id="empty-hint">Drag a terminal from the templates, or press ⌘D</div>
    <div id="tiles"></div>
    <div id="borders"></div>
    <div id="peak"></div>
    <div id="preview"></div>
    <div id="preview2"></div>
    <div id="ghost"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
