<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- SECURITY: UI CSP. Scripts only from the app (never tie-content:); no plugins, workers,
         forms, <base>. Frames: only content tiles (tie-content:), and main's nav lock narrows that
         to each tile's own viewer; frame-src also stops content frames navigating to other origins.
         Inline styles stay: xterm injects <style> elements and style attributes, no nonce support. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-src tie-content:; worker-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Tie</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="top">
      <div id="tabs"><button id="tab-add" title="New tab">+</button></div>
      <span id="brand"></span>
    </div>
    <div id="bottom"></div>
    <div id="shelf">
      <div id="templates"></div>
      <div class="sep"></div>
      <div id="items"></div>
    </div>
    <div id="empty-hint">Drag a terminal from the shelf, or press ⌘D</div>
    <div id="tiles"></div>
    <div id="borders"></div>
    <div id="peak"></div>
    <div id="preview"></div>
    <div id="shelf-line"></div>
    <div id="ghost"></div>
    <div id="quit-hold"><span>Hold ⌘Q to quit</span><div class="bar"></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
